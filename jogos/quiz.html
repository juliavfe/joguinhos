<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quiz · Joguinhos</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#07060f">
<link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icons/icon-180.png"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../style.css">
<style>
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .cat{padding:18px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
  .cat .i{font-size:28px}.cat b{display:block;margin-top:8px;font-size:16px}.cat small{color:var(--gold);font-size:12px}
  .cat.mix{grid-column:span 2;background:linear-gradient(120deg,#2a1b55,#15253b)}
  h2{margin:4px 0 4px;font-size:24px}
  .sub{color:var(--muted);margin:0 0 14px}
  #question{font-size:21px;font-weight:700;line-height:1.35;margin:18px 0 8px}
  .top{display:flex;justify-content:space-between;align-items:center}
  #fact{margin-top:12px;padding:14px 16px;border-radius:16px;background:rgba(124,247,255,.08);color:#cfefff;line-height:1.45;display:none}
  #next{display:none;width:100%;margin-top:14px}
</style>
</head><body>
<div class="bar"><a class="back" href="../index.html" id="back">←</a><div class="title">Quiz</div>
  <div class="stat"><small>Pontos</small><b id="score">0</b></div><div class="stat"><small>Recorde</small><b id="best">0</b></div></div>

<div class="page" id="menu">
  <h2>Escolha um tema</h2><p class="sub">10 perguntas, 15 segundos cada. Quanto mais rápido, mais pontos.</p>
  <div class="cats" id="cats"></div>
</div>

<div class="page" id="game" style="display:none">
  <div class="top"><span class="chip" id="cat"></span><span class="chip" id="count"></span></div>
  <div class="timer"><i id="bar"></i></div>
  <div id="question"></div>
  <div id="opts"></div>
  <div id="fact"></div>
  <button class="btn" id="next">Próxima →</button>
</div>

<div class="overlay hide" id="overlay"><h1>QUIZ</h1><p class="big" id="big" style="display:none"></p>
  <p id="msg"></p><div class="row"><button class="btn" id="play">De novo</button><button class="btn ghost" id="other">Outro tema</button></div></div>
<script src="../common.js"></script>
<script src="../dados.js"></script>
<script>
const ID='quiz',N=10,T=15;
J.$('best').textContent=J.best(ID);
let qs,i,score,hits,left,timer,cur,catKey,answered;
function menu(){
  J.$('menu').style.display='';J.$('game').style.display='none';J.$('overlay').classList.add('hide');
  const all=Object.values(QUIZ).reduce((n,c)=>n+c.q.length,0);
  J.$('cats').innerHTML=`<button class="cat mix" data-k="mix"><span class="i">🎲</span><b>Misturado</b><small>${J.best('quiz-mix')?'🏆 '+J.best('quiz-mix'):all+' perguntas'}</small></button>`+
    Object.entries(QUIZ).map(([k,c])=>`<button class="cat" data-k="${k}"><span class="i">${c.ic}</span><b>${c.nome}</b><small>${J.best('quiz-'+k)?'🏆 '+J.best('quiz-'+k):c.q.length+' perguntas'}</small></button>`).join('');
  J.$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.k));
}
function start(k){
  catKey=k;
  // evita repetir as perguntas da última rodada
  const seen=J.get('quiz-seen-'+k,[]);
  let pool=k==='mix'?Object.entries(QUIZ).flatMap(([ck,c])=>c.q.map(q=>({q,c:c.nome,id:ck+':'+q[0]}))):QUIZ[k].q.map(q=>({q,c:QUIZ[k].nome,id:k+':'+q[0]}));
  let fresh=pool.filter(p=>!seen.includes(p.id));if(fresh.length<N)fresh=pool;
  qs=J.shuffle(fresh).slice(0,N);J.set('quiz-seen-'+k,qs.map(p=>p.id).concat(seen).slice(0,Math.max(0,pool.length-N)));
  i=0;score=0;hits=0;J.$('score').textContent=0;
  J.$('menu').style.display='none';J.$('game').style.display='';J.$('overlay').classList.add('hide');
  show();
}
function show(){
  cur=qs[i];answered=false;const [q,ok,...rest]=cur.q;const wrong=rest.slice(0,3);
  J.$('cat').textContent=cur.c;J.$('count').textContent=`${i+1} / ${N}`;
  J.$('question').textContent=q;J.$('fact').style.display='none';J.$('next').style.display='none';
  J.$('opts').innerHTML='';
  J.shuffle([ok,...wrong]).forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t===ok);J.$('opts').appendChild(b);});
  left=T;clearInterval(timer);timer=setInterval(tick,100);tick();
}
function tick(){left-=.1;J.$('bar').style.width=Math.max(0,left/T*100)+'%';if(left<=0)pick(null,false);}
function pick(b,right){
  if(answered)return;answered=true;clearInterval(timer);
  const ok=cur.q[1];
  [...J.$('opts').children].forEach(x=>{if(x.textContent===ok)x.classList.add('ok');});
  if(right){hits++;score+=10+Math.ceil(Math.max(0,left));J.$('score').textContent=score;J.good();}
  else{if(b)b.classList.add('no');J.bad();}
  const f=cur.q[5];J.$('fact').innerHTML=(right?'✅ ':b?'❌ ':'⏰ Tempo esgotado! ')+(f||'');J.$('fact').style.display='block';
  J.$('next').textContent=i===N-1?'Ver resultado':'Próxima →';J.$('next').style.display='block';
}
J.$('next').onclick=()=>{i++;if(i<N)show();else end();};
function end(){
  J.record('quiz-'+catKey,score);
  J.over(ID,score,`Você acertou <b>${hits} de ${N}</b>.<br>`+(hits===N?'Gabaritou! 🤩':hits>=7?'Mandou muito bem!':hits>=4?'Bom! Cada rodada você aprende mais.':'Bora de novo, agora você já sabe algumas 😉'));
}
J.$('play').onclick=()=>start(catKey);J.$('other').onclick=menu;
menu();
</script></body></html>
