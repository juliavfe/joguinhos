<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palavra · Joguinhos</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ECECE7">
<link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icons/icon-180.png"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../style.css">
<style>
  .wrap{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--top) + 72px) 8px calc(var(--bot) + 12px)}
  .grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(78vw,330px)}
  .r{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .t{aspect-ratio:1;background:var(--paper-2);display:grid;place-items:center;font-weight:800;font-variation-settings:"opsz" 96,"wdth" 75;font-size:clamp(30px,9vw,40px);text-transform:uppercase;line-height:1}
  .t.f{background:var(--paper);box-shadow:inset 0 0 0 3px var(--ink)}
  .t.g{background:var(--verde);color:#FBF7EE;box-shadow:none}
  .t.y{background:var(--amarelo);color:var(--ink);box-shadow:none}
  .t.x{background:var(--paper-3);color:var(--ink-2);box-shadow:none}
  .kb{width:100%;max-width:500px;display:flex;flex-direction:column;gap:6px}
  .kr{display:flex;gap:5px;justify-content:center}
  .k{flex:1;max-width:44px;height:54px;background:var(--paper-2);font-weight:700;font-size:18px;text-transform:uppercase}
  .k:active{background:var(--paper-3)}
  .k.w{max-width:70px;flex:1.5;font-size:14px;text-transform:none}
  .k.g{background:var(--verde);color:#FBF7EE}.k.y{background:var(--amarelo)}.k.x{background:var(--ink);color:#8A8478}
  #toast{position:fixed;top:calc(var(--top) + 74px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:700;padding:10px 16px;opacity:0;transition:opacity .2s;z-index:40}
  .sq{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:4px}
</style>
</head><body>
<div class="bar"><a class="back" href="../index.html">←</a><div class="title">Palavra</div>
  <div class="stat"><small>Sequência</small><b id="score">0</b></div><div class="stat"><small>Recorde</small><b id="best">0</b></div></div>
<div class="wrap"><div class="grid" id="grid"></div><div class="kb" id="kb"></div></div>
<div id="toast"></div>
<div class="overlay tinta" id="overlay"><h1>Palavra</h1><p class="big" id="big" style="display:none"></p>
  <p id="msg"></p>
  <ul class="rules"><li>Descubra a palavra de 5 letras em 6 tentativas. Acento não conta.</li><li><span class="sq" style="background:var(--verde)"></span> Letra certa no lugar certo</li><li><span class="sq" style="background:var(--amarelo)"></span> A letra existe, mas em outro lugar</li><li><span class="sq" style="background:var(--paper-3)"></span> Não tem essa letra</li></ul>
  <button class="btn" id="play">Jogar</button></div>
<script src="../common.js"></script>
<script>
const ID='palavra';
const WORDS=`amigo arroz banco barco bolsa bravo cacau caixa calmo campo canto carta casal causa cerca chave chuva cinco circo coisa conta copos corpo couro creme custo dente dores doces drama exato extra falta farol feira festa fiapo filho final fogao folha fonte força forno fraco frase fruta fugir fumar gaita ganho garfo gente gesto girar globo golpe gordo gosto grama grato grupo gruta haver hotel ideia igual janta jeito jogar jovem juizo justo lapis larga leite lento letra limao linha lindo livro louco lugar manto massa medio meiga melao menta metro mexer milho mundo museu nadar natal navio nobre norte nuvem olhar ombro ordem ouvir ovelha padre palco papel parte passo pausa pedra peixe perto piano pilha placa plano pobre poema ponte porta posse prato prova pular quase queda radio raiva ramos rapaz regra reino resto risco ritmo rosto roupa sabor salto samba santo saude selva senso sinal sobre sonho sorte sushi tarde teste tigre tempo terra texto tomar torre trigo turma unica vacas valor velho venda verde vidro vinho viola visao vital vivos zebra arvore anjos fe pao`
  .split(/\s+/).filter(w=>w.length===5);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
J.$('best').textContent=J.best(ID);
let ans,row,col,board,done,streak=J.get('palavra-streak',0);
J.$('score').textContent=streak;
const tiles=[];
for(let r=0;r<6;r++){const rr=document.createElement('div');rr.className='r';tiles.push([]);
  for(let c=0;c<5;c++){const t=document.createElement('div');t.className='t';rr.appendChild(t);tiles[r].push(t);}J.$('grid').appendChild(rr);}
const keys={};
['qwertyuiop','asdfghjkl','⌫zxcvbnm↵'].forEach(line=>{const kr=document.createElement('div');kr.className='kr';
  [...line].forEach(ch=>{const b=document.createElement('button');b.className='k'+('⌫↵'.includes(ch)?' w':'');b.textContent=ch==='↵'?'Enviar':ch==='⌫'?'Apagar':ch;
    b.addEventListener('pointerdown',e=>{e.preventDefault();key(ch);});kr.appendChild(b);if(!'⌫↵'.includes(ch))keys[ch]=b;});
  J.$('kb').appendChild(kr);});
function toast(t){const e=J.$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1400);}
function start(){
  ans=norm(WORDS[Math.random()*WORDS.length|0]);row=0;col=0;done=false;board=[...Array(6)].map(()=>Array(5).fill(''));
  tiles.flat().forEach(t=>{t.className='t';t.textContent='';});Object.values(keys).forEach(k=>k.className='k');
  J.$('overlay').classList.add('hide');
}
function key(ch){
  if(done)return;
  if(ch==='⌫'){if(col>0){col--;board[row][col]='';tiles[row][col].textContent='';tiles[row][col].classList.remove('f');}return;}
  if(ch==='↵'){submit();return;}
  if(col<5){board[row][col]=ch;tiles[row][col].textContent=ch;tiles[row][col].classList.add('f');col++;J.beep(500,.03,'sine',.03);}
}
function submit(){
  if(col<5){toast('Faltam letras');tiles[row][0].parentNode.classList.add('shake');setTimeout(()=>tiles[row][0].parentNode.classList.remove('shake'),300);return;}
  const g=board[row].join(''),res=Array(5).fill('x'),pool={};
  for(let i=0;i<5;i++){if(g[i]===ans[i])res[i]='g';else pool[ans[i]]=(pool[ans[i]]||0)+1;}
  for(let i=0;i<5;i++){if(res[i]!=='g'&&pool[g[i]]){res[i]='y';pool[g[i]]--;}}
  const rank={x:1,y:2,g:3};
  const R=row;
  res.forEach((r,i)=>setTimeout(()=>{tiles[R][i].classList.add(r);J.beep(r==='g'?660:r==='y'?520:300,.05,'triangle',.04);
    const k=keys[g[i]];const cur=k.classList.contains('g')?'g':k.classList.contains('y')?'y':k.classList.contains('x')?'x':'';
    if(!cur||rank[r]>rank[cur]){k.classList.remove('g','y','x');k.classList.add(r);}},i*140));
  row++;col=0;
  if(g===ans){done=true;streak++;J.set('palavra-streak',streak);J.$('score').textContent=streak;
    setTimeout(()=>{J.good();J.over(ID,streak,`Acertou em ${R+1} ${R?'tentativas':'tentativa'}. Você está com ${streak} ${streak>1?'vitórias seguidas':'vitória seguida'}.`);J.$('big').textContent=ans.toUpperCase();J.$('play').textContent='Próxima palavra';},900);}
  else if(row===6){done=true;const s=streak;streak=0;J.set('palavra-streak',0);J.$('score').textContent=0;
    setTimeout(()=>{J.bad();J.over(ID,s,'Não foi dessa vez. A sequência voltou pra zero.');J.$('big').textContent='Era '+ans.toUpperCase();},900);}
}
addEventListener('keydown',e=>{if(!J.$('overlay').classList.contains('hide'))return;e.preventDefault();if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('↵');else if(/^[a-z]$/i.test(e.key))key(e.key.toLowerCase());});
J.$('play').onclick=start;
</script></body></html>
