<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Linha do Tempo · Joguinhos</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ECECE7">
<link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icons/icon-180.png"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../style.css">
<style>
  #menu h1{font-size:clamp(66px,20vw,120px);margin:4px 0 14px}
  #menu .lede{font-size:18.5px;margin:0 0 22px;max-width:24em}
  .cats{display:grid;gap:8px}
  .cat{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;min-height:118px;padding:16px;text-align:left;background:var(--c);color:var(--on-c);transition:transform .12s var(--ease)}
  .cat:active{transform:scale(.98)}
  .cat b{display:block;font-weight:800;font-variation-settings:"opsz" 96,"wdth" 75;font-size:44px;line-height:.92}
  .cat small{display:block;font-size:15px;margin-top:6px}
  .cat em{font-style:normal;font-size:14.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .top .chip:first-child{font-size:30px;font-weight:800;font-variation-settings:"opsz" 96,"wdth" 75;color:var(--ink)}
  #hint{color:var(--ink-2);margin:6px 0 8px;font-size:16px;min-height:2.9em}
  .ev{display:flex;align-items:center;gap:14px;min-height:66px}
  .ev .n{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 2.5px var(--ink-2);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
  .ev.sel .n{background:var(--ink);color:var(--paper);box-shadow:none}
  .ev.ok .n,.ev.no .n{background:#FBF7EE;color:var(--ink);box-shadow:none}
  .ev .y{margin-left:auto;padding-left:10px;font-weight:800;font-variation-settings:"opsz" 96,"wdth" 75;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
  #go{width:100%;margin-top:12px}
  #go:disabled{opacity:.35}
</style>
</head><body>
<div class="bar"><a class="back" href="../index.html">←</a><div class="title">Linha do Tempo</div>
  <div class="stat"><small>Pontos</small><b id="score">0</b></div><div class="stat"><small>Recorde</small><b id="best">0</b></div></div>

<div class="page" id="menu">
  <h1 class="display">Linha do Tempo</h1><p class="lede">5 rodadas. Em cada uma, toque nos 4 acontecimentos na ordem em que aconteceram, do primeiro pro último.</p>
  <div class="cats" id="cats"></div>
</div>
<div class="page" id="game" style="display:none">
  <div class="top"><span class="chip" id="cat"></span><span class="chip" id="count"></span></div>
  <div id="hint"></div>
  <div id="list"></div>
  <button class="btn" id="go">Conferir</button>
</div>
<div class="overlay verde hide" id="overlay"><h1>Linha do Tempo</h1><p class="big" id="big" style="display:none"></p>
  <p id="msg"></p><div class="row"><button class="btn" id="play">Jogar de novo</button><button class="btn ghost" id="other">Trocar tema</button></div></div>
<script src="../common.js"></script>
<script src="../dados.js"></script>
<script>
const ID='linha',ROUNDS=5,K=4,CORES={biblia:'amarelo',historia:'azul',cinema:'vermelho'};
J.$('best').textContent=J.best(ID);
let key,round,score,evs,order,checked;
function menu(){
  J.$('menu').style.display='';J.$('game').style.display='none';J.$('overlay').classList.add('hide');
  J.$('cats').innerHTML=Object.entries(LINHA).map(([k,c])=>`<button class="cat ${CORES[k]}" data-k="${k}"><div><b>${c.nome}</b><small>${c.dica}</small></div>${J.best('linha-'+k)?`<em>Recorde ${J.best('linha-'+k)}</em>`:''}</button>`).join('');
  J.$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.k));
}
function start(k){key=k;round=0;score=0;J.$('score').textContent=0;J.$('menu').style.display='none';J.$('game').style.display='';J.$('overlay').classList.add('hide');next();}
function next(){
  round++;checked=false;order=[];
  evs=J.shuffle(LINHA[key].e).slice(0,K);
  J.$('cat').textContent=LINHA[key].nome;J.$('count').textContent=`Rodada ${round} / ${ROUNDS}`;
  J.$('hint').textContent=LINHA[key].dica+'. Tocou errado? Toque de novo pra desmarcar.';
  J.$('go').textContent='Conferir';J.$('go').disabled=true;render();
}
function render(){
  J.$('list').innerHTML='';
  evs.forEach((e,idx)=>{
    const pos=order.indexOf(idx),b=document.createElement('button');
    b.className='opt ev'+(pos>=0?' sel':'');
    b.innerHTML=`<span class="n">${pos>=0?pos+1:''}</span><span>${e[0]}</span>${checked?`<span class="y">${e[2]}</span>`:''}`;
    if(checked){const right=[...evs].sort((a,c)=>a[1]-c[1]).indexOf(e);b.classList.add(right===pos?'ok':'no');if(right!==pos)b.querySelector('.n').textContent=right+1;}
    b.onclick=()=>tap(idx);J.$('list').appendChild(b);
  });
}
function tap(idx){
  if(checked)return;
  const p=order.indexOf(idx);
  if(p>=0)order=order.slice(0,p);else order.push(idx);
  J.beep(400+order.length*80,.05,'triangle',.05);
  const full=order.length===K;J.$('go').disabled=!full;render();
}
J.$('go').onclick=()=>{
  if(!checked){
    if(order.length<K)return;checked=true;
    const sorted=[...evs].sort((a,c)=>a[1]-c[1]);
    let pts=order.filter((idx,p)=>sorted[p]===evs[idx]).length;
    if(pts===K){pts++;J.good();}else J.bad();
    score+=pts;J.$('score').textContent=score;render();
    J.$('hint').textContent=pts>K?'Tudo na ordem certa! Valeu 5 pontos.':`Você acertou ${pts} de ${K} posições. O número no círculo mostra a posição certa.`;
    J.$('go').textContent=round<ROUNDS?'Próxima rodada →':'Ver resultado';
  }else if(round<ROUNDS)next();
  else{J.record('linha-'+key,score);J.over(ID,score,`De ${ROUNDS*(K+1)} pontos possíveis.<br>`+(score>=22?'Você domina a linha do tempo!':score>=14?'Muito bom!':'Cada rodada você aprende um pouco mais.'));}
};
J.$('play').onclick=()=>start(key);J.$('other').onclick=menu;
menu();
</script></body></html>
